[package]
name = "galatea"
version = "0.1.0"
edition = "2024"
description = "Probador virtual con IA generativa: demo presencial"
license = "MIT"

[[bin]]
name = "galatea"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
axum = { version = "0.8", features = ["json", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "charset", "http2", "query"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
image = "0.25"
getrandom = "0.4"
clap = { version = "4.6", features = ["derive"] }
tokio-stream = "0.1"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }

[features]
# Ayudantes que solo tienen sentido probando (Conf::para_pruebas).
pruebas = []

[dev-dependencies]
galatea = { path = ".", features = ["pruebas"] }
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
tempfile = "3.27"
futures-util = "0.3"
image = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "charset", "http2", "stream"] }
