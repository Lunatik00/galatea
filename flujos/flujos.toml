[[flujo]]
nombre = "leffa"
titulo = "Leffa"
descripcion = "Leffa VITON-HD (SD1.5 inpainting con atención de flujo), máscara y DensePose propias del nodo; repaint: conserva cara, pelo y el resto de la ropa; solo cambia la prenda. Licencia MIT (pesos franciszzj/Leffa y nodo ComfyUI-Leffa): candidato a producto."
archivo = "leffa.json"
nodo_persona = "1"
nodo_prenda = "2"
nodo_tipo = "4"
campo_tipo = "garment_type"
nodo_salida = "5"
# LeffaTryOn mete la foto en 768×1024 con relleno blanco y, con restore_size, estira ese
# marco rellenado al tamaño original: una foto 9:16 sale ~25 % más flaca y con franjas.
# Con encuadre = "3:4" Galatea le manda la foto ya a 3:4 y recorta el resultado de vuelta.
# Los otros flujos no lo piden: klein conserva la proporción de la foto (~1 MP) y CatVTON
# devolvió bien una foto 9:16; rellenarlos solo gastaría píxeles en franjas.
encuadre = "3:4"
# 2026-09-27: repaint = true. Con repaint = false la primera prueba real desde la página
# devolvió otra cara, otro pelo, otros pantalones y otros zapatos: el nodo entrega la imagen
# entera regenerada. Con repaint el nodo pega de vuelta la foto fuera de la máscara de la
# prenda (leffa/pipeline.py, do_repaint), todo dentro del marco 768×1024.
# viton_hd está entrenado con VITON-HD (solo prendas superiores). Para inferior y vestido
# habría que cambiar el nodo 3 a viton_dc y bajar virtual_tryon_dc.pth (7.2 GB).
tipos = ["superior"]
valores_tipo = { superior = "upper_body", inferior = "lower_body", vestido = "dresses" }

# Solo el subconjunto de franciszzj/Leffa que lee la tarea viton_hd (8.7 GB medidos con du -sb, de 36.8 GB):
# ComfyUI-Leffa busca todo bajo models/Leffa. pose_transfer.pth (21 GB) y
# virtual_tryon_dc.pth no hacen falta.

[[flujo.peso]]
url = "https://huggingface.co/franciszzj/Leffa/resolve/main/virtual_tryon.pth"
destino = "Leffa/virtual_tryon.pth"
sha256 = "f4d4b31dafac19ec5cc4ccbe307d4eb61b76a52f98aaef78fc02b4405c406351"

